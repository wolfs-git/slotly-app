name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://slotly:slotly@localhost:5433/slotly
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slotly
          POSTGRES_PASSWORD: slotly
          POSTGRES_DB: slotly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U slotly -d slotly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @slotly/api db:deploy
      - run: pnpm test
      - run: pnpm build
